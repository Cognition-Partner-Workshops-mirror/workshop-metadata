# Docker Compose configuration for the Natural Language Database Query tool.
#
# Services:
#   - postgres: PostgreSQL 16 database with sample data initialization
#   - ollama: Ollama LLM server for text generation and embeddings
#   - app: Streamlit web application
#
# Usage:
#   docker compose up --build
#   Then open http://localhost:8501 in your browser.

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: nlquery-postgres
    environment:
      POSTGRES_USER: nlquery
      POSTGRES_PASSWORD: nlquery
      POSTGRES_DB: nlquery
    ports:
      - "5432:5432"
    volumes:
      # Mount the initialization script to seed sample data on first run
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      # Persist database data across container restarts
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nlquery -d nlquery"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nlquery-net

  # ---------------------------------------------------------------------------
  # Ollama LLM server
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: nlquery-ollama
    ports:
      - "11434:11434"
    volumes:
      # Persist downloaded models across container restarts
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    # Pull the required models after the server starts
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Start Ollama server in the background
        ollama serve &
        # Wait for the server to be ready
        sleep 10
        # Pull the LLM model for SQL generation
        ollama pull llama3
        # Pull the embedding model for RAG
        ollama pull nomic-embed-text
        # Keep the container running (wait for the background server process)
        wait
    networks:
      - nlquery-net

  # ---------------------------------------------------------------------------
  # Streamlit application
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nlquery-app
    ports:
      - "8501:8501"
    environment:
      # Database connection settings (reference the postgres service)
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: nlquery
      POSTGRES_PASSWORD: nlquery
      POSTGRES_DB: nlquery
      DATABASE_URL: "postgresql+psycopg2://nlquery:nlquery@postgres:5432/nlquery"
      # Ollama connection settings (reference the ollama service)
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_LLM_MODEL: "llama3"
      OLLAMA_EMBED_MODEL: "nomic-embed-text"
      # FAISS persistence directory
      FAISS_INDEX_DIR: "/app/vectordb/index_store"
    volumes:
      # Persist the FAISS index across container restarts
      - faiss_data:/app/vectordb/index_store
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - nlquery-net

# ---------------------------------------------------------------------------
# Named volumes for data persistence
# ---------------------------------------------------------------------------
volumes:
  pgdata:
    driver: local
  ollama_data:
    driver: local
  faiss_data:
    driver: local

# ---------------------------------------------------------------------------
# Network configuration
# ---------------------------------------------------------------------------
networks:
  nlquery-net:
    driver: bridge
