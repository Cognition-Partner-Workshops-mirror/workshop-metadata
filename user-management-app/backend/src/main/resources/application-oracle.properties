# =====================================================
# Oracle Database Configuration Profile
# =====================================================
# Activate this profile with: --spring.profiles.active=oracle
# Configure the connection details below to match your Oracle instance.

# Oracle datasource connection settings
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:xe
spring.datasource.driverClassName=oracle.jdbc.OracleDriver
spring.datasource.username=${ORACLE_DB_USERNAME:admin}
spring.datasource.password=${ORACLE_DB_PASSWORD:admin}

# Hibernate dialect for Oracle
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable H2 console in Oracle profile
spring.h2.console.enabled=false
