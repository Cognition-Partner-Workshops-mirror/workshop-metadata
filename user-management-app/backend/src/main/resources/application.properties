# =====================================================
# User Management Application - Main Configuration
# =====================================================
# Default profile uses H2 in-memory database for development.
# Switch to 'oracle' profile for Oracle DB: --spring.profiles.active=oracle

spring.application.name=user-management

# Server port
server.port=8080

# =====================================================
# Default: H2 In-Memory Database (Development)
# =====================================================
spring.datasource.url=jdbc:h2:mem:usermanagementdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 console for development debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Jackson date format for consistent JSON date serialization
spring.jackson.serialization.write-dates-as-timestamps=false
